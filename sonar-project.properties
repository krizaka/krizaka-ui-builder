sonar.projectKey=krizaka_krizaka-ui-builder
sonar.organization=krizaka
sonar.sources=packages
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.*,**/*.spec.*,**/__tests__/**,**/__helpers__/**,**/e2e/**

# The jest report of packages/core (collectCoverage in jest.config.ts, passed by ci.yml sonar-coverage-paths). Without this key
# the scanner never reads it and the project shows no coverage measure (krizaka-internal#3553).
sonar.javascript.lcov.reportPaths=packages/*/coverage/lcov.info

# Test files are tests, not sources: they never count as code to cover (the new-code coverage gate, founder decision 9,
# krizaka-internal#3490) and test rules apply to them. The same patterns are excluded from the sources above.
sonar.tests=.
sonar.test.inclusions=**/*.test.*,**/*.spec.*,**/__tests__/**,**/__helpers__/**,**/e2e/**

# Not runtime code, so not measured for coverage: type declarations, the build config, the fixtures of the dev apps.
sonar.coverage.exclusions=**/*.d.ts,**/types/**,**/*.config.*,**/tsup.config.ts
